{% extends 'base.html' %}
{% load static %}

{% block title %}Contact Us{% endblock title %}

{% block content %}
<section class="py-5 bg-light">
    <div class="container">
        <div class="row align-items-center">
            <!-- Left Side: Contact Form and Social Media -->
            <div class="col-md-6">
                <div class="mb-5 text-center">
                    <h2 class="fw-bold">Get in Touch</h2>
                    <p class="text-muted">We'd love to hear from you! Whether you have a question, feedback, or just want to say hi, feel free to reach out.</p>
                </div>
                <div class="d-flex justify-content-center mb-4">
                    <a href="mailto:example@example.com" class="mx-2">
                        <i class="bi bi-envelope-fill contact-icon"></i>
                    </a>
                    <a href="https://www.facebook.com" target="_blank" class="mx-2">
                        <i class="bi bi-facebook contact-icon"></i>
                    </a>
                    <a href="https://telegram.org" target="_blank" class="mx-2">
                        <i class="bi bi-telegram contact-icon"></i>
                    </a>
                    <a href="https://www.instagram.com" target="_blank" class="mx-2">
                        <i class="bi bi-instagram contact-icon"></i>
                    </a>
                    <a href="https://www.messenger.com" target="_blank" class="mx-2">
                        <i class="bi bi-messenger contact-icon"></i>
                    </a>
                </div>
                <!-- Contact Form -->
                <form>
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter your name">
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Your Email</label>
                        <input type="email" class="form-control" id="email" placeholder="Enter your email">
                    </div>
                    <div class="mb-3">
                        <label for="message" class="form-label">Your Message</label>
                        <textarea class="form-control" id="message" rows="5" placeholder="Write your message"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Send Message</button>
                </form>
            </div>
            <!-- Right Side: Professional Image -->
            <div class="col-md-6">
                <div class="text-center">
                    <img src="https://picsum.photos/1920/1080" alt="Contact Us" class="img-fluid rounded shadow" style="max-height: 400px;">
                </div>
            </div>
        </div>
    </div>
</section>

<!-- Custom styling -->
<style>
    .contact-icon {
        font-size: 2rem;
        color: #007bff;
        transition: color 0.3s ease;
    }
    .contact-icon:hover {
        color: #0056b3;
    }
    .bg-light {
        background-color: #f8f9fa !important;
    }
</style>

{% endblock content %}
